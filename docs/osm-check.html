<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSMタグ登録状況 - 消防指令台 位置特定システム</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin: 0; background: #f5f5f5; }
    .oc-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px 16px 60px;
    }
    .oc-wrapper h1 {
      font-size: 20px;
      color: #1a1a2e;
      margin: 0 0 4px;
    }
    .oc-wrapper .subtitle {
      color: #666;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 12px;
      color: #2980b9;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
    .back-link:hover { text-decoration: underline; }

    /* 地図 */
    .map-area {
      position: relative;
      height: 320px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 16px;
    }
    .map-area #check-map { height: 100%; width: 100%; }
    .map-hint {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 1000;
      pointer-events: none;
      white-space: nowrap;
    }

    /* コントロール */
    .controls {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 16px 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .controls label {
      font-size: 13px;
      font-weight: 600;
      color: #444;
    }
    .controls .radius-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .controls input[type=range] { width: 140px; }
    .controls .radius-val {
      font-weight: 700;
      font-size: 14px;
      color: #1a1a2e;
      min-width: 50px;
    }
    .controls .loc-text {
      font-size: 12px;
      color: #888;
      flex: 1;
    }
    #btn-check {
      padding: 8px 24px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      background: #2980b9;
      color: #fff;
      cursor: pointer;
    }
    #btn-check:hover { background: #2471a3; }
    #btn-check:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    /* ローディング */
    .loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.3);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .loading-overlay.show { display: flex; }
    .loading-box {
      background: #fff;
      padding: 24px 40px;
      border-radius: 10px;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      color: #333;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .spinner {
      width: 32px; height: 32px;
      border: 4px solid #eee;
      border-top: 4px solid #2980b9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ポップアップ */
    .tag-popup { font-size: 12px; line-height: 1.6; max-height: 300px; overflow-y: auto; }
    .tag-popup .popup-title { font-weight: 700; font-size: 14px; color: #1a1a2e; margin-bottom: 6px; }
    .tag-popup .popup-cat { font-size: 11px; color: #fff; background: #27ae60; padding: 1px 8px; border-radius: 3px; display: inline-block; margin-bottom: 6px; }
    .tag-popup table { border-collapse: collapse; width: 100%; }
    .tag-popup td { padding: 2px 6px; border-bottom: 1px solid #f0f0f0; vertical-align: top; word-break: break-all; }
    .tag-popup td:first-child { font-weight: 600; color: #555; white-space: nowrap; width: 1%; }
    .tag-popup td:last-child { color: #333; }
  </style>
</head>
<body>
  <div class="oc-wrapper">
    <a href="index.html" class="back-link">&larr; トップに戻る</a>

    <h1>OSMタグ登録状況</h1>
    <p class="subtitle">指定した地点の周辺にどのカテゴリのOSMデータが登録されているかを確認できます</p>

    <div class="map-area">
      <div class="map-hint" id="map-hint">地図をクリックして確認地点を設定</div>
      <div id="check-map"></div>
    </div>

    <div class="controls">
      <div class="radius-group">
        <label>検索半径:</label>
        <input type="range" id="radius-slider" min="100" max="2000" step="100" value="500">
        <span class="radius-val" id="radius-val">500m</span>
      </div>
      <span class="loc-text" id="loc-text">未設定</span>
      <button id="btn-check" disabled>確認</button>
    </div>

  </div>

  <div class="loading-overlay" id="loading">
    <div class="loading-box">
      <div class="spinner"></div>
      Overpass API に問い合わせ中...
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  (() => {
    // ========== カテゴリ定義 ==========
    const CATEGORIES = [
      { id: 'convenience',  name: 'コンビニ',           match: t => t.shop === 'convenience' },
      { id: 'fastfood',     name: 'ファストフード',     match: t => t.amenity === 'fast_food' },
      { id: 'cafe',         name: 'カフェ・喫茶',       match: t => t.amenity === 'cafe' },
      { id: 'restaurant',   name: 'レストラン',         match: t => t.amenity === 'restaurant' },
      { id: 'bar',          name: '居酒屋・バー',       match: t => ['bar','pub','nightclub'].includes(t.amenity) },
      { id: 'bakery',       name: 'パン屋',             match: t => t.shop === 'bakery' },
      { id: 'supermarket',  name: 'スーパー',           match: t => t.shop === 'supermarket' },
      { id: 'drugstore',    name: 'ドラッグストア・薬局', match: t => t.shop === 'chemist' || t.shop === 'pharmacy' || t.amenity === 'pharmacy' },
      { id: 'public',       name: '公共施設',           match: t => ['police','fire_station','post_office','townhall','library'].includes(t.amenity) },
      { id: 'medical',      name: '医療',               match: t => ['hospital','clinic','dentist'].includes(t.amenity) },
      { id: 'education',    name: '教育',               match: t => ['school','university','kindergarten','childcare'].includes(t.amenity) },
      { id: 'religion',     name: '宗教施設',           match: t => t.amenity === 'place_of_worship' },
      { id: 'park',         name: '公園・レジャー',     match: t => ['park','pitch','sports_centre'].includes(t.leisure) },
      { id: 'station',      name: '駅・バス停',         match: t => t.railway === 'station' || t.highway === 'bus_stop' },
      { id: 'traffic',      name: '信号・踏切',         match: t => t.highway === 'traffic_signals' || t.railway === 'level_crossing' },
      { id: 'fuel',         name: 'ガソリンスタンド',   match: t => t.amenity === 'fuel' },
      { id: 'parking',      name: '駐車場',             match: t => t.amenity === 'parking' },
      { id: 'finance',      name: '銀行・ATM',          match: t => t.amenity === 'bank' || t.amenity === 'atm' },
      { id: 'hotel',        name: 'ホテル・旅館',       match: t => t.tourism === 'hotel' || t.tourism === 'guest_house' },
      { id: 'beauty',       name: '美容院・理容室',     match: t => t.shop === 'hairdresser' || t.shop === 'beauty' },
      { id: 'shops',        name: 'その他商業',         match: t => ['florist','books','variety_store','dry_cleaning'].includes(t.shop) },
      { id: 'landmark',     name: '橋・川・鳥居',       match: t => !!t.waterway || (t.bridge === 'yes' && !!t.highway) || t.man_made === 'torii' },
    ];

    const OVERPASS_ENDPOINT = 'https://overpass-api.de/api/interpreter';

    // カテゴリ別マーカー色
    const CAT_COLORS = {
      convenience:'#e67e22', fastfood:'#e74c3c', cafe:'#8e44ad', restaurant:'#2980b9',
      bar:'#c0392b', bakery:'#d4a574', supermarket:'#27ae60', drugstore:'#16a085',
      public:'#2c3e50', medical:'#e74c3c', education:'#3498db', religion:'#9b59b6',
      park:'#2ecc71', station:'#34495e', traffic:'#7f8c8d', fuel:'#f39c12',
      parking:'#95a5a6', finance:'#1abc9c', hotel:'#e67e22', beauty:'#eb6ca0',
      shops:'#7f8c8d', landmark:'#555',
    };

    // ========== 状態 ==========
    let selectedLat = null;
    let selectedLng = null;
    let centerMarker = null;
    let radiusCircle = null;
    let poiLayerGroup = null;

    // ========== DOM ==========
    const radiusSlider = document.getElementById('radius-slider');
    const radiusVal = document.getElementById('radius-val');
    const locText = document.getElementById('loc-text');
    const btnCheck = document.getElementById('btn-check');
    const loadingEl = document.getElementById('loading');
    const mapHint = document.getElementById('map-hint');

    // ========== 地図初期化 ==========
    const map = L.map('check-map').setView([35.69, 139.69], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);

    // ========== 地図クリック ==========
    map.on('click', (e) => {
      selectedLat = e.latlng.lat;
      selectedLng = e.latlng.lng;

      if (centerMarker) map.removeLayer(centerMarker);
      if (radiusCircle) map.removeLayer(radiusCircle);

      centerMarker = L.marker([selectedLat, selectedLng]).addTo(map);
      updateRadiusCircle();

      locText.textContent = `${selectedLat.toFixed(6)}, ${selectedLng.toFixed(6)}`;
      btnCheck.disabled = false;
      mapHint.textContent = '地点を変更するには地図を再クリック';
    });

    // ========== 半径スライダー ==========
    radiusSlider.addEventListener('input', () => {
      radiusVal.textContent = radiusSlider.value + 'm';
      updateRadiusCircle();
    });

    function updateRadiusCircle() {
      if (!selectedLat) return;
      if (radiusCircle) map.removeLayer(radiusCircle);
      radiusCircle = L.circle([selectedLat, selectedLng], {
        radius: parseInt(radiusSlider.value),
        color: '#2980b9',
        fillColor: '#2980b9',
        fillOpacity: 0.08,
        dashArray: '6,4',
        weight: 2,
        interactive: false,
      }).addTo(map);
    }

    // ========== 確認ボタン ==========
    btnCheck.addEventListener('click', async () => {
      if (!selectedLat || !selectedLng) return;
      const radius = parseInt(radiusSlider.value);
      btnCheck.disabled = true;
      loadingEl.classList.add('show');

      try {
        const pois = await fetchAllPOIs(selectedLat, selectedLng, radius);
        classifyAndRender(pois);
      } catch (e) {
        console.error('Overpass query error:', e);
        alert('Overpass API への問い合わせに失敗しました。\n時間をおいて再試行してください。');
      } finally {
        loadingEl.classList.remove('show');
        btnCheck.disabled = false;
      }
    });

    // ========== Overpass一括取得 ==========
    async function fetchAllPOIs(lat, lng, radius) {
      const r = radius;
      const query = `
        [out:json][timeout:20];
        (
          node[amenity](around:${r},${lat},${lng});
          way[amenity](around:${r},${lat},${lng});
          node[shop](around:${r},${lat},${lng});
          way[shop](around:${r},${lat},${lng});
          node[leisure](around:${r},${lat},${lng});
          way[leisure](around:${r},${lat},${lng});
          node[tourism](around:${r},${lat},${lng});
          way[tourism](around:${r},${lat},${lng});
          node[railway=station](around:${r},${lat},${lng});
          way[railway=station](around:${r},${lat},${lng});
          node[railway=level_crossing](around:${r},${lat},${lng});
          node[highway=bus_stop](around:${r},${lat},${lng});
          node[highway=traffic_signals](around:${r},${lat},${lng});
          way[bridge=yes][highway](around:${r},${lat},${lng});
          node[waterway](around:${r},${lat},${lng});
          way[waterway](around:${r},${lat},${lng});
          node[man_made=torii](around:${r},${lat},${lng});
        );
        out center body;
      `;
      const res = await fetch(OVERPASS_ENDPOINT, {
        method: 'POST',
        body: `data=${encodeURIComponent(query)}`,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      });
      if (!res.ok) throw new Error(`Overpass error: ${res.status}`);
      const data = await res.json();
      return data.elements.map(el => ({
        id: el.id,
        name: el.tags?.name || el.tags?.brand || '',
        lat: el.lat || el.center?.lat,
        lng: el.lon || el.center?.lon,
        tags: el.tags || {},
      })).filter(p => p.lat && p.lng);
    }

    // ========== 分類 & 描画 ==========
    function classifyAndRender(pois) {
      // 既存マーカークリア
      if (poiLayerGroup) map.removeLayer(poiLayerGroup);
      poiLayerGroup = L.layerGroup().addTo(map);

      for (const poi of pois) {
        let matched = false;
        for (const cat of CATEGORIES) {
          if (cat.match(poi.tags)) {
            const dist = distanceMeters(selectedLat, selectedLng, poi.lat, poi.lng);
            addPoiMarker({ ...poi, distance: Math.round(dist), catId: cat.id, catName: cat.name });
            matched = true;
            break;
          }
        }
        // どのカテゴリにも属さないPOIもマーカー表示
        if (!matched && poi.lat && poi.lng) {
          const dist = distanceMeters(selectedLat, selectedLng, poi.lat, poi.lng);
          addPoiMarker({ ...poi, distance: Math.round(dist), catId: null, catName: '未分類' });
        }
      }
    }

    // ========== 地図にPOIマーカー追加 ==========
    function addPoiMarker(poi) {
      const color = CAT_COLORS[poi.catId] || '#888';
      const cm = L.circleMarker([poi.lat, poi.lng], {
        radius: 7,
        fillColor: color,
        fillOpacity: 0.85,
        color: '#fff',
        weight: 2,
        bubblingMouseEvents: false,
      });

      cm.bindPopup(() => buildTagPopup(poi), { maxWidth: 360, maxHeight: 350 });
      poiLayerGroup.addLayer(cm);
    }

    // ========== 全タグ表示ポップアップ ==========
    function buildTagPopup(poi) {
      const name = poi.name || '(名称なし)';
      let rows = '';
      const tags = poi.tags;
      // タグをキー順でソート表示
      const keys = Object.keys(tags).sort();
      for (const k of keys) {
        rows += `<tr><td>${esc(k)}</td><td>${esc(tags[k])}</td></tr>`;
      }

      return `<div class="tag-popup">
        <div class="popup-title">${esc(name)}</div>
        <span class="popup-cat">${esc(poi.catName)}</span>
        <span style="font-size:12px;color:#2980b9;font-weight:600;margin-left:6px">${poi.distance}m</span>
        ${keys.length > 0
          ? `<table>${rows}</table>`
          : '<div style="color:#888;font-size:12px;margin-top:6px">タグ情報なし</div>'}
      </div>`;
    }

    // ========== ユーティリティ ==========
    function distanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat/2)**2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function esc(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  })();
  </script>
</body>
</html>
