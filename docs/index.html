<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>消防指令台 - 位置特定システム</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="operator-view">
    <header id="header">
      <div class="header-left">
        <h1>消防指令台 - 位置特定システム</h1>
      </div>
      <div class="header-right">
        <span id="connection-status" class="status-badge disconnected">未接続</span>
        <button id="btn-new-session" class="btn btn-secondary btn-small">リセット</button>
      </div>
    </header>

    <!-- セッション開始前 -->
    <div id="session-setup" class="session-setup">
      <div class="setup-card">
        <h2>セッションを開始</h2>
        <p>通報者の位置を特定するためのセッションを作成します。<br>
           作成後、通報者用リンクをスマホに送信してください。</p>
        <button id="btn-create-session" class="btn btn-primary btn-large">
          新規セッション作成
        </button>
        <div style="margin-top:16px">
          <button id="btn-start-test" class="btn btn-test btn-large">
            試験モードで開始
          </button>
        </div>
        <div style="margin-top:24px">
          <a href="guide.html" class="btn btn-secondary btn-large" style="text-decoration:none; display:inline-block">
            使い方
          </a>
        </div>
      </div>
    </div>

    <!-- メインコンテンツ -->
    <div id="main-content" class="main-content hidden">
      <div id="session-bar" class="session-bar">
        <div class="session-info">
          <span>セッションID: <strong id="display-session-id"></strong></span>
          <button id="btn-copy-link" class="btn btn-small" title="通報者用リンクをコピー">
            通報者リンクをコピー
          </button>
          <button id="btn-clear-poi" class="btn btn-small btn-warn" title="POIマーカーをクリア">
            POIクリア
          </button>
          <button id="btn-test-mode" class="btn btn-small btn-test" title="試験用に任意の位置・誤差を設定">
            試験モード
          </button>
        </div>
        <div id="caller-status" class="caller-status">
          <span class="dot red"></span> 通報者未接続
        </div>
      </div>

      <div class="content-area">
        <div class="map-container">
          <div id="map"></div>

          <!-- 試験モードパネル -->
          <div id="test-mode-panel" class="test-mode-panel hidden">
            <div class="test-mode-header">
              <span>試験モード</span>
              <button id="btn-test-close" class="btn btn-small btn-secondary">閉じる</button>
            </div>
            <div class="test-mode-body">
              <p class="test-hint">地図をクリックして位置を設定</p>
              <div class="test-field">
                <label>緯度:</label>
                <input type="number" id="test-lat" step="0.000001" placeholder="35.570000">
              </div>
              <div class="test-field">
                <label>経度:</label>
                <input type="number" id="test-lng" step="0.000001" placeholder="139.660000">
              </div>
              <div class="test-field">
                <label>誤差半径: <span id="test-accuracy-val">50</span>m</label>
                <input type="range" id="test-accuracy" min="5" max="500" value="50">
              </div>
              <button id="btn-test-apply" class="btn btn-primary btn-small" style="width:100%">この位置を設定</button>
            </div>
          </div>

          <div id="location-info" class="location-info hidden">
            <div class="location-detail">
              <span class="label">緯度:</span>
              <span id="info-lat">-</span>
            </div>
            <div class="location-detail">
              <span class="label">経度:</span>
              <span id="info-lng">-</span>
            </div>
            <div class="location-detail">
              <span class="label">精度:</span>
              <span id="info-accuracy">-</span>
            </div>
            <div class="location-detail">
              <span class="label">取得時刻:</span>
              <span id="info-time">-</span>
            </div>
          </div>
        </div>

        <div class="chat-container">
          <div class="chat-header">
            <h3>通信記録</h3>
          </div>
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chat-input-area">
            <textarea id="chat-input" placeholder="メッセージを入力... (Enter で送信)" rows="2"></textarea>
            <button id="btn-send" class="btn btn-primary">送信</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tiny-segmenter@0.2.0/tiny_segmenter.js"></script>
  <script src="js/map.js"></script>
  <script src="js/poi-search.js"></script>
  <script src="js/connection.js"></script>
  <script src="js/operator.js"></script>
</body>
</html>
